name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write  # required for Trivy SARIF upload to GitHub Security tab

jobs:
  tofu-validate:
    name: OpenTofu validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: "1.12.1"

      - name: Format check
        run: |
          cd tofu
          tofu fmt -check -recursive

      - name: Init root (no backend)
        run: |
          cd tofu
          tofu init -backend=false

      - name: Validate root configuration
        run: |
          cd tofu
          tofu validate -no-color

  tflint:
    name: tflint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup tflint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: latest

      - name: Init tflint
        run: |
          cd tofu
          tflint --init

      - name: Run tflint
        run: |
          cd tofu
          tflint --recursive --config "$(pwd)/.tflint.hcl"

  trivy:
    name: Trivy config scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # One scan: writes SARIF and fails the job on HIGH/CRITICAL findings.
      - name: Run Trivy IaC scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: config
          scan-ref: tofu
          version: v0.70.0
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          limit-severities-for-sarif: "true"
          exit-code: "1"

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-iac

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run ShellCheck (tofu/scripts)
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: tofu/scripts

  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: |
            **/*.md
            !**/.terraform/**

  examples:
    name: Examples lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: yamllint manifests
        run: |
          pip install --quiet yamllint
          yamllint -d '{extends: relaxed, rules: {line-length: disable}}' examples

      - name: Dry-run Makefile
        run: make -n -C examples/gitops-hello sync push
